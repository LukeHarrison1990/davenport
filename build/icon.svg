<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="dav-stem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4338CA"/><stop offset="1" stop-color="#1E1B6B"/></linearGradient>
    <linearGradient id="dav-bowl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
    <linearGradient id="dav-fold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1040" stop-opacity=".45"/><stop offset="1" stop-color="#0B1040" stop-opacity="0"/></linearGradient>
    <mask id="dav-counter"><rect width="256" height="256" fill="#fff"/><path d="M108 92h14a36 36 0 0 1 0 72h-14z" fill="#000"/></mask>
  </defs>
  <!-- Davenport "Fold": a bright bowl folding over a dark stem to make the D. -->
